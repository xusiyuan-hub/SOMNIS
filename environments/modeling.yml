# Core environment reconstructed from versions reported by the study team.
# This is an installation recipe, not a complete cross-platform lockfile.
name: somnis-modeling
channels:
- conda-forge
dependencies:
- python=3.10.19
- pip
- pip:
  - numpy==2.2.6
  - scipy==1.15.3
  - pandas==2.3.3
  - scikit-learn==1.7.2
  - xgboost==3.1.3
  - shap==0.49.1
  - matplotlib==3.10.8
  - joblib==1.5.3
